services:
  hh-bot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Uvicorn слушает сеть контейнера, но Docker публикует порт только на localhost.
      HH_BOT_HOST: "0.0.0.0"
      HH_BOT_UNSAFE_EXPOSE: "1"
    volumes:
      - ./data:/app/data
      - ./web_app.py:/app/web_app.py
      - ./app:/app/app
      - ./static:/app/static
    restart: unless-stopped
